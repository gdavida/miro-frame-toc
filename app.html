<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Table of Contents</title>
    <link rel="stylesheet" href="https://unpkg.com/mirotone/dist/styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #faf0ff 0%, #fff5f7 50%, #f0f5ff 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0px 20px 14px 25px;
            border-bottom: 1px solid rgba(255, 182, 193, 0.2);
            box-shadow: 0 4px 20px rgba(255, 182, 193, 0.1);
        }

        .header p {
            font-size: 12px;
            color: #6b7280;
            font-weight: 400;
            margin-bottom: 14px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 16px;
            border: none;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            letter-spacing: 0.1px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #c66cfd;
            border: 1.5px solid rgba(198, 108, 253, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(198, 108, 253, 0.5);
            transform: translateY(-1px);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.1);
            border-radius: 10px;
        }

        .content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            border-radius: 10px;
        }

        .toc-list {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 182, 193, 0.15);
            border: 1px solid rgba(255, 182, 193, 0.1);
            padding: 6px 16px 6px 8px;
            list-style: none;
            margin: 0;
        }

        .toc-list ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .toc-item {
            padding: 0 0 0 10px;
            border-bottom: 1px solid rgba(255, 182, 193, 0.1);
            transition: all 0.2s;
            position: relative;
        }

        /* Nested list items */
        .toc-sublist {
            margin: 0;
            padding: 0;
        }

        .toc-sublist .toc-item {
            padding-left: 30px;
        }

        .toc-sublist .toc-sublist .toc-item {
            padding-left: 50px;
        }

        .toc-sublist .toc-sublist .toc-sublist .toc-item {
            padding-left: 70px;
        }

        .toc-item:hover {
            background: linear-gradient(90deg, rgba(255, 182, 193, 0.1) 0%, rgba(198, 108, 253, 0.05) 100%);
        }

        .toc-item:last-child {
            border-bottom: none;
        }

        /* Remove border from last item in sublists */
        .toc-sublist .toc-item:last-child {
            border-bottom: 1px solid rgba(255, 182, 193, 0.1);
        }

        .toc-list > .toc-item:last-child,
        .toc-list > .toc-item:last-child .toc-sublist .toc-item:last-child {
            border-bottom: none;
        }

        .toc-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 0 8px 0;
        }

        /* Hierarchy indicators */
        .hierarchy-indicator {
            flex-shrink: 0;
            color: #4a5568;
            font-size: 12px;
            line-height: 1;
            display: flex;
            align-items: center;
            padding-bottom: 5px;
        }

        .frame-name {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            text-decoration: none;
            flex: 1;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            line-height: 1.2;
            justify-content: space-between;
            border-bottom: 1px solid #4a5568;
            vertical-align: middle;
            padding: 0 0 5px 0px;
        }

        .frame-name:hover {
            color: #c66cfd;
            transform: translateX(2px);
        }

        .link-icon {
            width: 12px;
            height: 12px;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 80px 30px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
            stroke: url(#gradient);
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .empty-state p {
            font-size: 14px;
            color: #9ca3af;
        }

        .status-message {
            padding: 10px 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 12px;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .status-success {
            background: linear-gradient(135deg, rgba(134, 239, 172, 0.2) 0%, rgba(59, 130, 246, 0.1) 100%);
            color: #059669;
            border: 1px solid rgba(134, 239, 172, 0.3);
        }

        .status-error {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.2) 0%, rgba(255, 107, 157, 0.1) 100%);
            color: #dc2626;
            border: 1px solid rgba(255, 182, 193, 0.3);
        }

        .error-state {
            text-align: center;
            padding: 60px 30px;
            color: #dc2626;
        }

        .error-state h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #c66cfd;
            font-weight: 500;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(198, 108, 253, 0.2);
            border-top: 3px solid transparent;
            border-left: 3px solid transparent;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-right: 14px;
            position: relative;
        }

        .spinner::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid #ff6b9d;
            border-right: 3px solid #c66cfd;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <p style="line-height:1">Easily find all frames on your board. Use *-* in frame names to create hierarchy. <a href="https://forms.gle/sAaop5SotZ3WCYmA8" target="_blank" style="color:inherit">New feature requests?</a></p>
        <div class="controls">
            <button class="btn btn-primary" onclick="refreshFrames()">
                Refresh
            </button>
        </div>
    </div>

    <div class="content">
        <div id="statusMessage"></div>
        <div id="tocContainer">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading frames...</span>
            </div>
        </div>
    </div>

    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
    <script>
        let frames = [];
        const HIERARCHY_SEPARATOR = '*-*';

        // Initialize the app
        async function initApp() {
            try {
                console.log('Initializing Frame TOC app...');

                // Check if Miro SDK is available
                if (typeof miro === 'undefined') {
                    throw new Error('Miro SDK not available');
                }

                console.log('Miro SDK available, loading frames...');

                // Initial load
                await refreshFrames();

                // Listen for frame changes (simplified event listeners)
                try {
                    if (typeof miro !== 'undefined' && miro.board && miro.board.ui) {
                        miro.board.ui.on('items:create', handleItemChange);
                        miro.board.ui.on('items:delete', handleItemChange);
                    }
                } catch (error) {
                    console.warn('Could not set up event listeners:', error);
                }

                console.log('App initialized successfully');

            } catch (error) {
                console.error('Failed to initialize app:', error);
                showError('Failed to initialize app. Please make sure you are running this inside Miro.');
            }
        }

        async function handleItemChange(event) {
            try {
                // Check if any of the items are frames
                if (event.items && event.items.some(item => item.type === 'frame')) {
                    await refreshFrames();
                }
            } catch (error) {
                console.error('Error handling item change:', error);
            }
        }

        async function refreshFrames() {
            try {
                const container = document.getElementById('tocContainer');
                container.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading frames...</span></div>';

                console.log('Fetching board items...');

                // Get all items on the board
                const items = await miro.board.get();
                console.log('Found', items.length, 'items on board');

                // Filter for frames
                frames = items.filter(item => item.type === 'frame');
                console.log('Found', frames.length, 'frames');

                if (frames.length === 0) {
                    showEmptyState();
                    return;
                }

                renderTableOfContents();
                showStatus(`Found ${frames.length} frame${frames.length !== 1 ? 's' : ''}`, 'success');

            } catch (error) {
                console.error('Failed to refresh frames:', error);
                showError('Failed to load frames. Please try again.');
            }
        }

        function parseFrameHierarchy(frames) {
            // Build a tree structure for proper nesting
            const tree = [];
            const frameMap = new Map();
            
            // First, create all frame objects
            frames.forEach(frame => {
                const title = frame.title || '';
                
                if (title.includes(HIERARCHY_SEPARATOR)) {
                    const parts = title.split(HIERARCHY_SEPARATOR).map(p => p.trim());
                    frameMap.set(title, {
                        frame: frame,
                        displayName: parts[parts.length - 1],
                        parts: parts,
                        children: []
                    });
                } else {
                    tree.push({
                        frame: frame,
                        displayName: title,
                        children: []
                    });
                }
            });
            
            // Build hierarchy
            frameMap.forEach((item, key) => {
                if (item.parts.length === 2) {
                    // Direct child - add to root
                    tree.push(item);
                } else {
                    // Nested child - find parent
                    let parentPath = item.parts.slice(0, -1).join(HIERARCHY_SEPARATOR);
                    let parent = frameMap.get(parentPath);
                    
                    if (parent) {
                        parent.children.push(item);
                    } else {
                        // Parent doesn't exist as a frame, add to root
                        tree.push(item);
                    }
                }
            });
            
            // Sort function for items and their children
            const sortItems = (items) => {
                items.sort((a, b) => a.displayName.localeCompare(b.displayName));
                items.forEach(item => {
                    if (item.children.length > 0) {
                        sortItems(item.children);
                    }
                });
            };
            
            sortItems(tree);
            return tree;
        }

        function getHierarchyIndicator(level) {
            if (level === 1) return '›';
            if (level === 2) return '•';
            if (level === 3) return '◦';
            return '›';
        }

        function renderTableOfContents() {
            const container = document.getElementById('tocContainer');
            
            if (frames.length === 0) {
                showEmptyState();
                return;
            }

            const tree = parseFrameHierarchy(frames);
            
            // Build nested list HTML
            function buildListHTML(items, level = 0) {
                if (items.length === 0) return '';
                
                let html = level === 0 ? '<ul class="toc-list">' : '<ul class="toc-sublist">';
                
                items.forEach(item => {
                    const frameId = item.frame.id;
                    const frameName = item.displayName;
                    const indicator = level > 0 ? getHierarchyIndicator(level) : '';
                    
                    html += '<li class="toc-item">';
                    html += '<div class="toc-header">';
                    
                    if (indicator) {
                        html += `<span class="hierarchy-indicator" aria-hidden="true">${indicator}</span>`;
                    }
                    
                    html += `<a href="#" class="frame-name" onclick="navigateToFrame('${frameId}'); return false;" aria-label="Navigate to ${escapeHtml(frameName)}">`;
                    html += escapeHtml(frameName);
                    html += `<svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                            </svg>`;
                    html += '</a>';
                    html += '</div>';
                    
                    // Add nested children if they exist
                    if (item.children && item.children.length > 0) {
                        html += buildListHTML(item.children, level + 1);
                    }
                    
                    html += '</li>';
                });
                
                html += '</ul>';
                return html;
            }
            
            container.innerHTML = buildListHTML(tree);
        }

        async function navigateToFrame(frameId) {
            try {
                const frame = frames.find(f => f.id === frameId);
                if (frame) {
                    // First, zoom to the frame to get the natural zoom level
                    await miro.board.viewport.zoomTo([frame]);
                    
                    // Get the resulting viewport after zoom
                    const viewport = await miro.board.viewport.get();
                    
                    // Calculate how much of the frame width is visible in the viewport
                    // This gives us the zoom factor
                    const zoomFactor = viewport.width / frame.width;
                    
                    // Panel width constant
                    const PANEL_WIDTH = 368;
                    
                    // Calculate dynamic offset based on the zoom level
                    // When zoomed out (wider frames), we need less offset
                    // When zoomed in (narrower frames), we need more offset
                    const dynamicOffset = PANEL_WIDTH / zoomFactor;
                    
                    // Apply a scaling factor to fine-tune the offset
                    // Wider frames (aspect ratio > 1.5) need less compensation
                    const aspectRatio = frame.width / frame.height;
                    let offsetMultiplier = 1;
                    
                    if (aspectRatio > 2) {
                        offsetMultiplier = 0.5;  // Very wide frames: use half offset
                    } else if (aspectRatio > 1.5) {
                        offsetMultiplier = 0.7;  // Wide frames: use 70% offset
                    } else if (aspectRatio < 0.5) {
                        offsetMultiplier = 1.2;  // Very narrow frames: use 120% offset
                    }
                    
                    const finalOffset = -dynamicOffset * offsetMultiplier;
                    
                    // Apply the calculated offset
                    await miro.board.viewport.set({
                        viewport: {
                            x: viewport.x + finalOffset,
                            y: viewport.y,
                            width: viewport.width,
                            height: viewport.height
                        },
                        animationDurationInMs: 300
                    });
                    
                    showStatus('Navigated to frame', 'success');
                }
            } catch (error) {
                console.error('Failed to navigate to frame:', error);
                showStatus('Failed to navigate to frame', 'error');
            }
        }

        function showEmptyState() {
            const container = document.getElementById('tocContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="11" y2="17"></line>
                    </svg>
                    <h3>No frames found</h3>
                    <p>Create frames on your board to generate a table of contents</p>
                </div>
            `;
        }

        function showError(message) {
            const container = document.getElementById('tocContainer');
            container.innerHTML = `
                <div class="error-state">
                    <h3>Error</h3>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="initApp()">Retry</button>
                </div>
            `;
        }

        function showStatus(message, type) {
            const container = document.getElementById('statusMessage');
            container.innerHTML = `
                <div class="status-message status-${type}">
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize when the page loads
        window.addEventListener('load', function() {
            console.log('Page loaded, initializing app...');
            initApp();
        });
    </script>
</body>
</html>
