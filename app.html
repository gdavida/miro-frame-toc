<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Table of Contents</title>
    <link rel="stylesheet" href="https://unpkg.com/mirotone/dist/styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #faf0ff 0%, #fff5f7 50%, #f0f5ff 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 28px 24px 24px 24px;
            border-bottom: 1px solid rgba(255, 182, 193, 0.2);
            box-shadow: 0 4px 20px rgba(255, 182, 193, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            color: #6b7280;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #c66cfd;
            border: 1.5px solid rgba(198, 108, 253, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(198, 108, 253, 0.5);
            transform: translateY(-1px);
        }

        .sort-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .sort-toggle label {
            font-size: 14px;
            color: #8b5cf6;
            font-weight: 500;
        }

        .toggle-switch {
            width: 48px;
            height: 26px;
            background: rgba(198, 108, 253, 0.2);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(198, 108, 253, 0.3);
        }

        .toggle-switch.active {
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            border-color: transparent;
        }

        .toggle-slider {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(22px);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.1);
            border-radius: 10px;
        }

        .content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            border-radius: 10px;
        }

        .toc-list {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 182, 193, 0.15);
            border: 1px solid rgba(255, 182, 193, 0.1);
        }

        .toc-item {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255, 182, 193, 0.1);
            transition: all 0.3s;
            position: relative;
        }

        .toc-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .toc-item:hover {
            background: linear-gradient(90deg, rgba(255, 182, 193, 0.1) 0%, rgba(198, 108, 253, 0.05) 100%);
            padding-left: 28px;
        }

        .toc-item:hover::before {
            transform: scaleX(1);
        }

        .toc-item:last-child {
            border-bottom: none;
        }

        .toc-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .frame-number {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
        }

        .frame-name {
            font-size: 15px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            text-decoration: none;
            flex: 1;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .frame-name:hover {
            color: #c66cfd;
            transform: translateX(2px);
        }

        .link-icon {
            width: 14px;
            height: 14px;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .copy-link-btn {
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-link-btn:hover {
            background: rgba(198, 108, 253, 0.1);
        }

        .copy-link-btn svg {
            width: 16px;
            height: 16px;
            stroke: #c66cfd;
        }

        .description-container {
            margin-left: 46px;
            margin-top: 6px;
        }

        .description-text {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.08) 0%, rgba(198, 108, 253, 0.05) 100%);
            border-radius: 12px;
            margin-top: 6px;
            border: 1px solid rgba(198, 108, 253, 0.1);
        }

        .description-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(198, 108, 253, 0.2);
            border-radius: 12px;
            font-size: 14px;
            resize: vertical;
            min-height: 70px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
        }

        .description-input:focus {
            outline: none;
            border-color: rgba(198, 108, 253, 0.5);
            box-shadow: 0 0 0 4px rgba(198, 108, 253, 0.1);
            background: white;
        }

        .edit-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 16px;
        }

        .edit-btn {
            background: none;
            border: none;
            color: #c66cfd;
            cursor: pointer;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 12px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .edit-btn:hover {
            background: rgba(198, 108, 253, 0.1);
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 80px 30px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
            stroke: url(#gradient);
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .empty-state p {
            font-size: 14px;
            color: #9ca3af;
        }

        .status-message {
            padding: 14px 18px;
            margin: 16px 0;
            border-radius: 12px;
            font-size: 14px;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .status-success {
            background: linear-gradient(135deg, rgba(134, 239, 172, 0.2) 0%, rgba(59, 130, 246, 0.1) 100%);
            color: #059669;
            border: 1px solid rgba(134, 239, 172, 0.3);
        }

        .status-error {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.2) 0%, rgba(255, 107, 157, 0.1) 100%);
            color: #dc2626;
            border: 1px solid rgba(255, 182, 193, 0.3);
        }

        .error-state {
            text-align: center;
            padding: 60px 30px;
            color: #dc2626;
        }

        .error-state h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #c66cfd;
            font-weight: 500;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(198, 108, 253, 0.2);
            border-top: 3px solid transparent;
            border-left: 3px solid transparent;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b9d 0%, #c66cfd 100%);
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-right: 14px;
            position: relative;
        }

        .spinner::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid #ff6b9d;
            border-right: 3px solid #c66cfd;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Table of Contents</h1>
        <p>Easily find all frames on your board</p>
        <div class="controls">
            <button class="btn btn-primary" onclick="refreshFrames()">
                Refresh
            </button>
            <button class="btn btn-secondary" onclick="exportToClipboard()">
                Copy to Clipboard
            </button>
            <div class="sort-toggle">
                <label>Sort A-Z</label>
                <div class="toggle-switch" id="sortToggle" onclick="toggleSort()">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        <div id="statusMessage"></div>
        <div id="tocContainer">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading frames...</span>
            </div>
        </div>
    </div>

    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
    <script>
        let frames = [];
        let descriptions = {};
        let sortAlphabetically = true;
        let editingFrame = null;

        // Initialize the app
        async function initApp() {
            try {
                console.log('Initializing Frame TOC app...');

                // Check if Miro SDK is available
                if (typeof miro === 'undefined') {
                    throw new Error('Miro SDK not available');
                }

                console.log('Miro SDK available, loading frames...');

                // Initial load
                await refreshFrames();

                // Load saved settings
                try {
                    const savedSettings = await miro.board.storage.get('tocSettings');
                    if (savedSettings) {
                        sortAlphabetically = savedSettings.sortAlphabetically !== false;
                        updateSortToggle();
                    }

                    // Load saved descriptions
                    descriptions = await miro.board.storage.get('frameDescriptions') || {};
                } catch (error) {
                    console.warn('Could not load saved settings:', error);
                }

                // Listen for frame changes
                try {
                    miro.board.ui.on('items:create', handleItemChange);
                    miro.board.ui.on('items:update', handleItemChange);
                    miro.board.ui.on('items:delete', handleItemChange);
                } catch (error) {
                    console.warn('Could not set up event listeners:', error);
                }

                console.log('App initialized successfully');

            } catch (error) {
                console.error('Failed to initialize app:', error);
                showError('Failed to initialize app. Please make sure you are running this inside Miro.');
            }
        }

        async function handleItemChange(event) {
            try {
                // Check if any of the items are frames
                if (event.items && event.items.some(item => item.type === 'frame')) {
                    await refreshFrames();
                }
            } catch (error) {
                console.error('Error handling item change:', error);
            }
        }

        async function refreshFrames() {
            try {
                const container = document.getElementById('tocContainer');
                container.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading frames...</span></div>';

                console.log('Fetching board items...');

                // Get all items on the board
                const items = await miro.board.get();
                console.log('Found', items.length, 'items on board');

                // Filter for frames
                frames = items.filter(item => item.type === 'frame');
                console.log('Found', frames.length, 'frames');

                if (frames.length === 0) {
                    showEmptyState();
                    return;
                }

                // Sort frames
                if (sortAlphabetically) {
                    frames.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
                } else {
                    // Sort by position (top to bottom, left to right)
                    frames.sort((a, b) => {
                        if (Math.abs(a.y - b.y) < 50) {
                            return a.x - b.x;
                        }
                        return a.y - b.y;
                    });
                }

                renderTableOfContents();
                showStatus(`Found ${frames.length} frame${frames.length !== 1 ? 's' : ''}`, 'success');

            } catch (error) {
                console.error('Failed to refresh frames:', error);
                showError('Failed to load frames. Please try again.');
            }
        }

        function renderTableOfContents() {
            const container = document.getElementById('tocContainer');
            
            if (frames.length === 0) {
                showEmptyState();
                return;
            }

            let html = '<div class="toc-list">';
            
            frames.forEach((frame, index) => {
                const frameId = frame.id;
                const frameName = frame.title || `Frame ${index + 1}`;
                const description = descriptions[frameId] || '';
                const frameUrl = getFrameUrl(frameId);
                
                html += `
                    <div class="toc-item">
                        <div class="toc-header">
                            <div class="frame-number">${index + 1}</div>
                            <a href="#" class="frame-name" onclick="navigateToFrame('${frameId}'); return false;" title="${frameUrl}">
                                <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                </svg>
                                ${escapeHtml(frameName)}
                            </a>
                            <button class="copy-link-btn" onclick="copyFrameLink('${frameId}', '${escapeHtml(frameName)}')" title="Copy link to this frame">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                                </svg>
                            </button>
                            ${!description && editingFrame !== frameId ? `
                                <button class="edit-btn" onclick="startEditing('${frameId}')">
                                    + Add description
                                </button>
                            ` : ''}
                        </div>
                        <div class="description-container">
                            ${editingFrame === frameId ? `
                                <textarea 
                                    class="description-input" 
                                    id="desc-${frameId}"
                                    placeholder="Enter a description for this frame..."
                                >${escapeHtml(description)}</textarea>
                                <div class="edit-controls">
                                    <button class="btn btn-primary btn-small" onclick="saveDescription('${frameId}')">
                                        Save
                                    </button>
                                    <button class="btn btn-secondary btn-small" onclick="cancelEditing()">
                                        Cancel
                                    </button>
                                </div>
                            ` : description ? `
                                <div class="description-text">
                                    ${escapeHtml(description)}
                                    <button class="edit-btn" onclick="startEditing('${frameId}')">
                                        ✏️ Edit
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function getFrameUrl(frameId) {
            // Get the current board URL and construct the frame link
            const currentUrl = window.location.href;
            const boardMatch = currentUrl.match(/\/app\/board\/([^\/\?]+)/);
            
            if (boardMatch && boardMatch[1]) {
                const boardId = boardMatch[1];
                return `https://miro.com/app/board/${boardId}/?moveToWidget=${frameId}`;
            }
            
            // Fallback - try to construct from current URL
            const baseUrl = currentUrl.split('?')[0].split('#')[0];
            return `${baseUrl}?moveToWidget=${frameId}`;
        }

        async function copyFrameLink(frameId, frameName) {
            try {
                const frameUrl = getFrameUrl(frameId);
                await navigator.clipboard.writeText(frameUrl);
                showStatus(`Link copied for "${frameName}"`, 'success');
            } catch (error) {
                console.error('Failed to copy link:', error);
                showStatus('Failed to copy link', 'error');
            }
        }

        async function navigateToFrame(frameId) {
            try {
                const frame = frames.find(f => f.id === frameId);
                if (frame) {
                    await miro.board.viewport.zoomTo(frame);
                    showStatus('Navigated to frame', 'success');
                }
            } catch (error) {
                console.error('Failed to navigate to frame:', error);
                showStatus('Failed to navigate to frame', 'error');
            }
        }

        function startEditing(frameId) {
            editingFrame = frameId;
            renderTableOfContents();
            // Focus on the textarea
            setTimeout(() => {
                const textarea = document.getElementById(`desc-${frameId}`);
                if (textarea) {
                    textarea.focus();
                    textarea.select();
                }
            }, 100);
        }

        function cancelEditing() {
            editingFrame = null;
            renderTableOfContents();
        }

        async function saveDescription(frameId) {
            try {
                const textarea = document.getElementById(`desc-${frameId}`);
                if (textarea) {
                    descriptions[frameId] = textarea.value.trim();
                    await miro.board.storage.set('frameDescriptions', descriptions);
                    editingFrame = null;
                    renderTableOfContents();
                    showStatus('Description saved', 'success');
                }
            } catch (error) {
                console.error('Failed to save description:', error);
                showStatus('Failed to save description', 'error');
            }
        }

        async function toggleSort() {
            sortAlphabetically = !sortAlphabetically;
            updateSortToggle();
            
            // Save preference
            try {
                await miro.board.storage.set('tocSettings', { sortAlphabetically });
            } catch (error) {
                console.warn('Could not save sort preference:', error);
            }
            
            await refreshFrames();
        }

        function updateSortToggle() {
            const toggle = document.getElementById('sortToggle');
            if (sortAlphabetically) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }
        }

        async function exportToClipboard() {
            try {
                let text = 'Table of Contents\n';
                text += '==================\n\n';
                
                frames.forEach((frame, index) => {
                    const frameName = frame.title || `Frame ${index + 1}`;
                    const description = descriptions[frame.id] || '';
                    const frameUrl = getFrameUrl(frame.id);
                    
                    text += `${index + 1}. ${frameName}\n`;
                    if (description) {
                        text += `   Description: ${description}\n`;
                    }
                    text += `   Link: ${frameUrl}\n`;
                    text += '\n';
                });
                
                await navigator.clipboard.writeText(text);
                showStatus('Table of contents with links copied!', 'success');
            } catch (error) {
                console.error('Failed to copy to clipboard:', error);
                showStatus('Failed to copy to clipboard', 'error');
            }
        }

        function showEmptyState() {
            const container = document.getElementById('tocContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="11" y2="17"></line>
                    </svg>
                    <h3>No frames found</h3>
                    <p>Create frames on your board to generate a table of contents</p>
                </div>
            `;
        }

        function showError(message) {
            const container = document.getElementById('tocContainer');
            container.innerHTML = `
                <div class="error-state">
                    <h3>Error</h3>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="initApp()">Retry</button>
                </div>
            `;
        }

        function showStatus(message, type) {
            const container = document.getElementById('statusMessage');
            container.innerHTML = `
                <div class="status-message status-${type}">
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize when the page loads
        window.addEventListener('load', function() {
            console.log('Page loaded, initializing app...');
            initApp();
        });
    </script>
</body>
</html>
