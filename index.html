<!DOCTYPE html>
<html>
<head>
    <title>Frame TOC</title>
</head>
<body>
    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
    <script>
        // Wait for the SDK to be fully available
        async function initializeApp() {
            try {
                console.log('Initializing Miro app...');
                
                // Wait for miro to be available
                if (typeof miro === 'undefined') {
                    console.error('Miro SDK not available');
                    return;
                }

                console.log('Miro SDK available, setting up icon click handler...');

                // Set up the icon click handler
                miro.board.ui.on('icon:click', async () => {
                    console.log('Icon clicked, opening panel...');
                    try {
                        await miro.board.ui.openPanel({
                            url: 'app.html',
                            height: 600
                            
                        });
                        console.log('Panel opened successfully');
                    } catch (error) {
                        console.error('Failed to open panel:', error);
                    }
                });

                console.log('App initialized successfully');
            } catch (error) {
                console.error('Failed to initialize app:', error);
            }
        }

        // Initialize when the page loads
        window.addEventListener('load', initializeApp);
    </script>
</body>
</html>
